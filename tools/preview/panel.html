<style>#pv{position:fixed;left:8px;right:8px;top:max(8px,env(safe-area-inset-top));z-index:99999;background:#fff;border-radius:16px;box-shadow:0 3px 0 rgba(0,0,0,.15);padding:8px;font:800 12px 'Open Sans',sans-serif;display:flex;flex-wrap:wrap;gap:4px;align-items:center;flex-wrap:nowrap}
#pv select,#pv button{font:inherit;border-radius:10px;border:2px solid #E3E6EC;background:#F4F6F9;padding:5px 7px}#pv select{max-width:120px}#pv button.on{background:#22305A;color:#fff;border-color:#22305A}
#pv .tag{background:#F0A830;color:#fff;border-radius:8px;padding:3px 7px;font-size:11px}#pv .hide{margin-left:auto}#pv.min>*:not(.hide){display:none}</style>
<div id="pv"><span class="tag">APERÇU</span><select id="pvRoom"></select><button data-s="s">S</button><button data-s="m" class="on">M</button><button data-s="l">L</button><button id="pvGo">↻</button><button class="hide" id="pvHide">–</button></div>
<script type="module">
const $=(i)=>document.getElementById(i);const q=new URLSearchParams(location.search);let size=q.get('size')||'m';
const wait=()=>new Promise(r=>{const t=setInterval(()=>{if(window.__dbg&&window.__dbg.ROOMS){clearInterval(t);r(window.__dbg)}},200)});
const d=await wait();const sel=$('pvRoom');
for(const k of Object.keys(d.ROOMS)){const o=document.createElement('option');o.value=k;o.textContent=d.ROOMS[k].e+' '+k;sel.append(o)}
sel.value=q.get('room')&&d.ROOMS[q.get('room')]?q.get('room'):'career';
document.querySelectorAll('#pv [data-s]').forEach(b=>{b.classList.toggle('on',b.dataset.s===size);b.onclick=()=>{size=b.dataset.s;document.querySelectorAll('#pv [data-s]').forEach(x=>x.classList.toggle('on',x===b));show()}});
sel.onchange=show;$('pvGo').onclick=show;$('pvHide').onclick=()=>$('pv').classList.toggle('min');
function show(){const type=sel.value;history.replaceState(null,'','?room='+type+'&size='+size+(q.get('city')?'&city='+q.get('city'):''));
 try{d.closeModal()}catch(e){}try{d.closeSheet()}catch(e){}
 d.startNew(q.get('city')||'london');try{d.closeModal()}catch(e){}d.S.tut=-1;d.S.cash=1e6;try{d.updateTut()}catch(e){}
 d.startPlace({type,size});const pr=d.placingR;let ok=false;
 if(pr){outer:for(const a of [0,1])for(let z=-4;z>=-22;z--)for(let x=-6;x<=16;x++){pr.x=x;pr.z=z;pr.a=a;if(d.placeValid(pr)){ok=true;break outer}}}
 if(ok){d.placeShow();d.endPlace(true)}else{d.endPlace(false)}try{d.closeSheet()}catch(e){}
 const r=d.S.rooms[d.S.rooms.length-1];if(r){const v=d.view;v.tx=r.x;v.tz=r.z;v.half=7;d.placeCam()}}
// DEMO (?demo=lagos): a centre already running, real characters only (it waits for every model before opening the doors)
async function demo(){const city=q.get('demo')==='1'?'lagos':q.get('demo');$('pv').style.display='none';
 try{d.closeModal()}catch(e){}d.startNew(city);try{d.closeModal()}catch(e){}const S=d.S;S.tut=-1;S.cash=1e6;S.stars=1;d.setSpeed(0);S.annex='owned';S.annex2='owned';try{d.buildAnnexLot()}catch(e){}
 const ok=await d.modelsReady(city); // every real character first: nobody is built from a stand-in
 // a planned centre: two straight rows of regular rooms facing one corridor, small rooms in the side plot (falls back to the first free spot elsewhere)
 const PI=Math.PI, PLAN={lagos:[['budget','m',-14.5,3.5,PI],['garage','m',-8.5,3.5,PI],['nap','m',-2.5,3.5,PI],['therapy','m',-14.5,-4.5,0],['social','m',-8.5,-4.5,0],['lab','m',-2.5,-4.5,0],['pharmacy','s',8.5,4.5,PI],['detox','s',12.5,4.5,PI],['cafe','s',8.5,-1.5,0],['toilet','s',12.5,-1.5,0]]};
 const plan=PLAN[city]||[['budget','m'],['nap','m'],['pharmacy','s'],['detox','s'],['therapy','s'],['social','m'],['lab','m'],['cafe','s'],['toilet','s']];
 S.dev=['social','parent','career','moving','glowup'];const miss=[];
 for(const [type,size,x,z,a] of plan){d.startPlace({type,size});const pr=d.placingR;let ok=false;
  if(pr&&x!=null){for(const aa of [a,a+PI,a+PI/2,a-PI/2]){pr.x=x;pr.z=z;pr.a=aa;if(d.placeValid(pr)){ok=true;break}}}
  if(pr&&!ok){miss.push(type);outer:for(const aa of [0,1])for(let zz=4;zz>=-26;zz--)for(let xx=-20;xx<=20;xx++){pr.x=xx;pr.z=zz;pr.a=aa*PI/2;if(d.placeValid(pr)){ok=true;break outer}}}
  if(ok){d.placeShow();d.endPlace(true)}else d.endPlace(false);try{d.closeSheet()}catch(e){}}
 for(const role of ['coach','coach','guide','guide','guide','pharmacist','therapist','therapist','researcher','researcher','host','maint','maint'])try{d.openHire(role);d.hire(0,role);d.closeSheet()}catch(e){}
 const P=d.PROBLEMS,all=Object.keys(P).filter(k=>!P[k].myst&&!P[k].epi&&(!P[k].city||P[k].city===city));const built=new Set(d.S.rooms.map(r=>r.type));
 S.known=all.filter(k=>built.has(P[k].room)&&!['lonely','gloom','subs'].includes(k));S.discAt=null;S.cash=42000;S.vibes=82;
 for(const dec of [['bench3',-8.5,-0.9],['plant',-11.6,-0.5],['vending',3.2,-0.9],['plant',6.9,1.5]])try{d.startDecor(dec[0]);d.decorTo(dec[1],dec[2]);d.endDecor(true)}catch(e){}
 d.setSpeed(1);for(let i=0;i<8;i++)d.spawnVisitor();
 setInterval(()=>{const n=d.R.visitors.filter(v=>!['exit','angry'].includes(v.state)).length;if(n<14)d.spawnVisitor();if(d.S.vibes<75)d.S.vibes=75;},2200); // a busy centre: clients keep coming in
 const v=d.view;v.tx=-4;v.tz=0;v.half=9;d.placeCam();document.title='Life Crisis Tycoon · démo';window.__demoMiss=miss;window.__demoReady=ok;}
if(q.get('demo'))setTimeout(demo,800);else setTimeout(show,800);
</script>
